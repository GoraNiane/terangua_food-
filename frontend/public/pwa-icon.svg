<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="50%" stop-color="#0A0A0A"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="50%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fond arrondi PWA Luxury Dark -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="496" height="496" x="8" y="8" rx="104" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Cloche Gastronomique / Gourmet Cloche -->
  <g transform="translate(0, -10)">
    <!-- Bouton supérieur cloche -->
    <circle cx="256" cy="140" r="20" fill="url(#goldGrad)" filter="url(#glow)"/>
    <ellipse cx="256" cy="165" rx="30" ry="8" fill="url(#goldGrad)"/>

    <!-- Dôme de la cloche -->
    <path d="M 120 310 C 120 180, 392 180, 392 310 Z" fill="url(#goldGrad)"/>
    <path d="M 135 305 C 135 195, 377 195, 377 305 Z" fill="#0A0A0A" opacity="0.15"/>
    <path d="M 150 295 C 170 210, 300 190, 340 220" fill="none" stroke="url(#goldLight)" stroke-width="6" stroke-linecap="round" opacity="0.6"/>

    <!-- Rebord et plateau -->
    <rect x="96" y="310" width="320" height="24" rx="12" fill="url(#goldGrad)"/>
    <ellipse cx="256" cy="334" rx="170" ry="12" fill="url(#goldGrad)"/>
    <ellipse cx="256" cy="342" rx="190" ry="10" fill="#0A0A0A" opacity="0.5"/>

    <!-- Vapeur aromatique élégante -->
    <path d="M 220 120 Q 210 90 230 70" fill="none" stroke="url(#goldLight)" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
    <path d="M 256 115 Q 266 85 246 65" fill="none" stroke="url(#goldLight)" stroke-width="7" stroke-linecap="round" opacity="0.9"/>
    <path d="M 292 120 Q 302 90 282 70" fill="none" stroke="url(#goldLight)" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- Typographie TERANGA FOOD -->
  <text x="256" y="415" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-weight="900" font-size="34" fill="url(#goldLight)" letter-spacing="6">TERANGA</text>
  <text x="256" y="455" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-weight="700" font-size="22" fill="#FFFFFF" letter-spacing="12" opacity="0.9">FOOD</text>
</svg>
